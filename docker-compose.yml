services:
  db:
    image: mariadb:10.6
    container_name: west_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword_west}
      MYSQL_DATABASE: west_db
      MYSQL_USER: west_user
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-west_password}
    volumes:
      - db_data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "3307:3306"
    networks:
      - west-network

  phpmyadmin:
    image: phpmyadmin
    container_name: west_phpmyadmin
    restart: unless-stopped
    ports:
      - "8082:80"
    # environment:
      # PMA_HOST: db
      # PMA_USER: west_user
      # PMA_PASSWORD: ${MYSQL_PASSWORD:-west_password}
    depends_on:
      - db
    networks:
      - west-network

  frontend:
    image: node:20-alpine
    container_name: west_frontend
    working_dir: /app
    command: sh -c "yarn install && yarn dev --hostname 0.0.0.0"
    ports:
      - "3000:3000"
    environment:
      - DB_HOST=db
      - DB_PORT=3306
      - DB_USER=west_user
      - DB_PASSWORD=${MYSQL_PASSWORD:-west_password}
      - DB_NAME=west_db
      - NEXT_PUBLIC_ADMIN_WA_NUMBER=${NEXT_PUBLIC_ADMIN_WA_NUMBER:-6281234567890}
    volumes:
      - .:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - db
    networks:
      - west-network

volumes:
  db_data:
  frontend_node_modules:

networks:
  west-network:
    driver: bridge
