services:
  db:
    container_name: west_db
    build: 
      context: ./database
    restart: unless-stopped
    environment:
      - MARIADB_ROOT_PASSWORD=${DB_PASSWORD:?DB_PASSWORD is required}
      - MARIADB_DATABASE=${DB_NAME}
      - MARIADB_USER=${DB_USER}
      - MARIADB_PASSWORD=${DB_PASSWORD:?DB_PASSWORD is required}
    volumes:
      - db_data:/var/lib/mysql
    ports:
      - "3307:3306"
    networks:
      - west-network

  phpmyadmin:
    image: phpmyadmin
    container_name: west_phpmyadmin
    restart: unless-stopped
    ports:
      - "8082:80"
    # environment:
      # PMA_HOST: db
      # PMA_USER: west_user
      # PMA_PASSWORD: ${MYSQL_PASSWORD:-west_password}
    depends_on:
      - db
    networks:
      - west-network

  frontend:
    image: node:20-alpine
    container_name: west_frontend
    working_dir: /app
    command: sh -c "yarn install && yarn dev --hostname 0.0.0.0"
    ports:
      - "3000:3000"
    environment:
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${MYSQL_PASSWORD:-west_password}
      - DB_NAME=${DB_NAME}
      - NEXT_PUBLIC_ADMIN_WA_NUMBER=${NEXT_PUBLIC_ADMIN_WA_NUMBER:-6281234567890}
    volumes:
      - .:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - db
    networks:
      - west-network

volumes:
  db_data:
  frontend_node_modules:

networks:
  west-network:
    driver: bridge
